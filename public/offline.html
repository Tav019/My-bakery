<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff8f3;
        color: #43302a;
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .box { max-width: 320px; }
      .emoji { font-size: 48px; margin-bottom: 12px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #8a7768; font-size: 14px; line-height: 1.5; }
      button {
        margin-top: 16px;
        background: #d97757;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="emoji">🧁</div>
      <h1>Sin conexión</h1>
      <p>No hay internet en este momento. Las páginas que ya visitaste siguen disponibles; el resto se cargará al reconectarte.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
